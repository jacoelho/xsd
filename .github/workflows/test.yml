on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
name: test
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: 'actions/checkout@v6'

      - uses: 'actions/setup-go@v6'
        with:
          go-version-file: 'go.mod'

      - uses: 'actions/setup-node@v6'
        with:
          node-version: '24'

      - parallel:
          - name: Staticcheck
            run: make staticcheck

          - name: Lint
            run: make lint

      - run: npm ci --prefix docs/js

      - run: npm exec --prefix docs/js -- playwright install --with-deps chromium

      - parallel:
          - name: Native tests with race detection
            run: make race

          - name: WASM tests
            run: make wasm-test

          - name: Worker tests
            run: make web-test

          - name: Browser tests
            run: make browser-test

      - run: make fuzz-smoke

      - run: make bench-smoke
