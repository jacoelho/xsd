on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
name: test
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The test job is a required status check, so it is skipped rather than
  # filtered with paths-ignore: a skipped job reports success, while a workflow
  # that never starts leaves the required check pending.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: 'actions/checkout@v6'
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if { [ "$EVENT" != push ] && [ "$EVENT" != pull_request ]; } ||
            ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo code=true >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...$HEAD" | grep -qv '\.md$'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: 'actions/checkout@v6'

      - uses: 'actions/setup-go@v6'
        with:
          go-version-file: 'go.mod'

      - uses: 'actions/setup-node@v6'
        with:
          node-version: '24'

      - parallel:
          - name: Staticcheck
            run: make staticcheck

          - name: Lint
            run: make lint

      - run: npm ci --prefix web/js

      - run: npm exec --prefix web/js -- playwright install --with-deps chromium

      - parallel:
          - name: Native tests with race detection
            run: make race

          - name: WASM tests
            run: make wasm-test

          - name: Worker tests
            run: make web-test

          - name: Browser tests
            run: make browser-test

      - run: make fuzz-smoke

      - run: make bench-smoke
